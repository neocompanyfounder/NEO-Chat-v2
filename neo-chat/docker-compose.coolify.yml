version: '3.8'

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: neo-chat-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-neochat}
      - POSTGRES_USER=${POSTGRES_USER:-neochat_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-CHANGE_ME_SECURE_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neochat_user} -d ${POSTGRES_DB:-neochat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neo-chat-network
    labels:
      - "coolify.managed=true"

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: neo-chat-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neo-chat-network
    labels:
      - "coolify.managed=true"

  # Evolution API for WhatsApp integration
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: neo-chat-evolution
    restart: unless-stopped
    environment:
      # Server Configuration
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=${EVOLUTION_SERVER_URL:-https://evolution.neoo.com.sa}
      
      # CORS Configuration
      - CORS_ORIGIN=*
      - CORS_METHODS=POST,GET,PUT,DELETE
      - CORS_CREDENTIALS=true
      
      # Authentication
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-CHANGE_ME_EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      
      # Database Configuration (PostgreSQL)
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-neochat_user}:${POSTGRES_PASSWORD:-CHANGE_ME_SECURE_PASSWORD}@postgres:5432/${POSTGRES_DB:-neochat}
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      
      # Redis Configuration
      - REDIS_ENABLED=true
      - REDIS_URI=redis://:${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}@redis:6379
      - REDIS_PREFIX=evolution
      
      # Webhook Configuration
      - WEBHOOK_GLOBAL_ENABLED=false
      - WEBHOOK_GLOBAL_URL=
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      
      # RabbitMQ (Optional - disabled by default)
      - RABBITMQ_ENABLED=false
      
      # SQS (Optional - disabled by default)
      - SQS_ENABLED=false
      
      # Websocket
      - WEBSOCKET_ENABLED=false
      
      # Instance Configuration
      - CONFIG_SESSION_PHONE_CLIENT=NEO Chat
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - DEL_INSTANCE=false
      
      # QR Code
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#198754
      
      # Typebot Integration (Optional)
      - TYPEBOT_ENABLED=false
      
      # Chatwoot Integration (Optional)
      - CHATWOOT_ENABLED=false
      
      # OpenAI Integration (Optional)
      - OPENAI_ENABLED=false
      
      # Dify Integration (Optional)
      - DIFY_ENABLED=false
      
      # Log Level
      - LOG_LEVEL=ERROR
      - LOG_COLOR=true
      - LOG_BAILEYS=error
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - neo-chat-network
    labels:
      - "coolify.managed=true"
      - "coolify.domain=evolution.neoo.com.sa"
      - "coolify.https=true"

  # NEO Chat Application
  neo-chat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neo-chat-app
    restart: unless-stopped
    environment:
      # Google Cloud Services (REQUIRED - You need to provide these)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      
      # Evolution API (WhatsApp) - Internal connection
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-CHANGE_ME_EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME:-neochat}
      - EVOLUTION_TIMEOUT=10
      
      # Database Configuration - Internal connection
      - SUPABASE_URL=postgresql://${POSTGRES_USER:-neochat_user}:${POSTGRES_PASSWORD:-CHANGE_ME_SECURE_PASSWORD}@postgres:5432/${POSTGRES_DB:-neochat}
      - SUPABASE_KEY=${POSTGRES_PASSWORD:-CHANGE_ME_SECURE_PASSWORD}
      
      # Redis Configuration
      - REDIS_URL=redis://:${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}@redis:6379
      
      # Application Settings
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      
      # Chunking Configuration
      - MIN_CHUNK_TOKENS=100
      - MAX_CHUNK_TOKENS=500
      - CHUNK_OVERLAP_TOKENS=50
      
      # Rate Limiting
      - GEMINI_RATE_LIMIT=60
      - WHATSAPP_RATE_LIMIT=60
      
      # Timeouts
      - GEMINI_TIMEOUT=30
      - SUPABASE_TIMEOUT=5
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - neo-chat-network
    labels:
      - "coolify.managed=true"
      - "coolify.domain=neochat.neoo.com.sa"
      - "coolify.https=true"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  evolution_instances:
    driver: local
  evolution_store:
    driver: local

networks:
  neo-chat-network:
    driver: bridge

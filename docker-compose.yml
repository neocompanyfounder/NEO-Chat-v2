version: '3.8'

services:
  neo-chat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neo-chat-app
    ports:
      - "8000:8000"
    env_file:
      - neo-chat/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - neo-chat-network

networks:
  neo-chat-network:
    driver: bridge
